<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Клуб</title>
  <!-- v2.180.0: без запроса favicon.ico (его нет — был 404 на каждом первом
       запуске); app.js и шрифт качаются сразу, вместе со стилями, а не когда до
       них дойдёт загрузчик внизу страницы -->
  <link rel="icon" href="data:,">
  <link rel="preload" href="static/app.js" as="script">
  <link rel="preload" href="static/fonts/Raleway-Subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <main class="screen" id="app">
    <div class="state boot" id="boot-state" role="status">
      <div class="boot-art" aria-hidden="true"><i class="boot-shadow"></i><i class="boot-ball"></i><i class="boot-net"></i><i class="boot-table"></i></div>
      <div class="boot-title">Клуб настольного тенниса</div>
      <div class="boot-sub">Загрузка…</div>
    </div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
  <!-- Скрипт Telegram — своя копия (v2.178.0, scripts/update_telegram_js.py),
       не с telegram.org: висящий telegram.org не давал Telegram убрать заставку. -->
  <script src="static/telegram-web-app.js"></script>
  <script>
    // Загрузчик (v2.164.2, v2.175.0, v2.178.0). Telegram держит свою заставку с
    // полоской загрузки, пока приложение не скажет «готово» (web_app_ready) или
    // пока страница не загрузится целиком. До v2.178.0 и то и другое ждало скрипт
    // с telegram.org: если он у игрока отвечал медленно или висел, полоска
    // вставала «на первых процентах», хотя приложение под ней уже было готово.
    // Теперь скрипт свой, а «готово» уходит сразу, как только страница
    // нарисована, — даже если скрипт не загрузился (тогда — напрямую через мост
    // Telegram, как это делает сам скрипт). Дальше — наша «Загрузка…» и сторож:
    // если за WATCHDOG_MS первый экран не показался — сообщение с кнопкой
    // «Обновить» и отчёт на сервер (в лог).
    (function () {
      var WATCHDOG_MS = 12000;
      var appLoaded = false, appFailed = false, lastError = "";
      var launchHash = location.hash;
      var w = window.Telegram && window.Telegram.WebApp;

      window.addEventListener("error", function (e) {
        if (e && e.message) lastError = e.message + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "");
      });

      // Событие для Telegram в обход скрипта — тем же путём, что и telegram-web-app.js
      function postEvent(type) {
        try {
          if (window.TelegramWebviewProxy !== undefined) {
            window.TelegramWebviewProxy.postEvent(type, JSON.stringify(""));
          } else if (window.external && "notify" in window.external) {
            window.external.notify(JSON.stringify({ eventType: type, eventData: "" }));
          } else if (window.parent !== window) {
            window.parent.postMessage(JSON.stringify({ eventType: type, eventData: "" }), "*");
          }
        } catch (e) { /* не в Telegram — нечего сообщать */ }
      }

      // «Готово» — сразу: игрок видит нашу «Загрузку…» и сторожа, а не заставку
      try {
        if (w) { w.ready(); w.expand(); }
        else { postEvent("web_app_ready"); postEvent("web_app_expand"); }
      } catch (e) { postEvent("web_app_ready"); }

      function param(name) {
        var m = new RegExp("[#&?]" + name + "=([^&]*)").exec(launchHash);
        if (!m) return "";
        try { return decodeURIComponent(m[1].replace(/\+/g, "%20")); } catch (e) { return m[1]; }
      }

      function bootApp() {
        var s = document.createElement("script");
        s.src = "static/app.js";
        s.onload = function () { appLoaded = true; };
        s.onerror = function () { appFailed = true; };
        document.body.appendChild(s);
      }

      function report(stage) {
        var initData = param("tgWebAppData");
        if (!initData) {
          try { initData = JSON.parse(sessionStorage.getItem("__telegram__initParams")).tgWebAppData || ""; } catch (e) { initData = ""; }
        }
        if (!initData || !window.fetch) return;
        try {
          fetch("api/boot_fail", {
            method: "POST", keepalive: true,
            headers: { "Authorization": "tma " + initData, "Content-Type": "application/json" },
            body: JSON.stringify({ stage: stage, error: lastError, tg: !!w,
              platform: param("tgWebAppPlatform"), version: param("tgWebAppVersion") })
          }).catch(function () {});
        } catch (e) { /* отчёт не должен мешать */ }
      }

      function watchdog() {
        var node = document.getElementById("boot-state");
        if (!node) return;  // первый экран показан
        report(appFailed ? "app_js_failed" : appLoaded ? "no_first_screen" : "app_js_pending");
        node.textContent = "Приложение не запустилось. Проверьте соединение. ";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "button button-quiet";
        b.textContent = "Обновить";
        b.addEventListener("click", function () { location.reload(); });
        node.parentNode.appendChild(b);
      }

      bootApp();
      setTimeout(watchdog, WATCHDOG_MS);
    })();
  </script>
</body>
</html>
