<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Клуб</title>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <main class="screen" id="app">
    <p class="state" id="boot-state">Загрузка…</p>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
  <script>
    // Загрузчик (v2.164.2, переделан в v2.175.0). Страница рисуется сразу,
    // app.js грузится тут же, а скрипт Telegram — параллельно, с таймаутом и
    // повторами. Раньше app.js ждал скрипт Telegram: если telegram.org у игрока
    // открывался медленно или не открывался, оставалась «Загрузка…». Теперь
    // приложение стартует без него (подпись для входа — из адреса запуска) и
    // подключает его, когда он придёт. Если за WATCHDOG_MS первый экран так и не
    // показался — сообщение с кнопкой «Обновить» и отчёт на сервер (в лог).
    (function () {
      var URL = "https://telegram.org/js/telegram-web-app.js";
      var TIMEOUT_MS = 5000, MAX_TRIES = 4, WATCHDOG_MS = 12000;
      var tries = 0, telegramLoaded = false, appLoaded = false, appFailed = false, lastError = "";
      var launchHash = location.hash;

      window.addEventListener("error", function (e) {
        if (e && e.message) lastError = e.message + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "");
      });

      function param(name) {
        var m = new RegExp("[#&?]" + name + "=([^&]*)").exec(launchHash);
        if (!m) return "";
        try { return decodeURIComponent(m[1].replace(/\+/g, "%20")); } catch (e) { return m[1]; }
      }

      function onTelegram() {
        telegramLoaded = true;
        if (window.__clubOnTelegram) window.__clubOnTelegram();
      }

      function attempt() {
        if (telegramLoaded) return;
        if (tries >= MAX_TRIES) return;  // приложение работает и без него
        tries += 1;
        var mine = tries;
        var s = document.createElement("script");
        s.src = URL + (mine > 1 ? "?retry=" + mine : "");
        // Опоздавший ответ предыдущей попытки тоже годится
        s.onload = onTelegram;
        s.onerror = function () { if (!telegramLoaded && tries === mine) setTimeout(attempt, 300); };
        document.head.appendChild(s);
        setTimeout(function () { if (!telegramLoaded && tries === mine) attempt(); }, TIMEOUT_MS);
      }

      function bootApp() {
        var s = document.createElement("script");
        s.src = "static/app.js";
        s.onload = function () { appLoaded = true; };
        s.onerror = function () { appFailed = true; };
        document.body.appendChild(s);
      }

      function report(stage) {
        var initData = param("tgWebAppData");
        if (!initData) {
          try { initData = JSON.parse(sessionStorage.getItem("__telegram__initParams")).tgWebAppData || ""; } catch (e) { initData = ""; }
        }
        if (!initData || !window.fetch) return;
        try {
          fetch("api/boot_fail", {
            method: "POST", keepalive: true,
            headers: { "Authorization": "tma " + initData, "Content-Type": "application/json" },
            body: JSON.stringify({ stage: stage, error: lastError, tg: telegramLoaded,
              platform: param("tgWebAppPlatform"), version: param("tgWebAppVersion") })
          }).catch(function () {});
        } catch (e) { /* отчёт не должен мешать */ }
      }

      function watchdog() {
        var node = document.getElementById("boot-state");
        if (!node) return;  // первый экран показан
        report(appFailed ? "app_js_failed" : appLoaded ? "no_first_screen" : "app_js_pending");
        node.textContent = "Приложение не запустилось. Проверьте соединение. ";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "button button-quiet";
        b.textContent = "Обновить";
        b.addEventListener("click", function () { location.reload(); });
        node.parentNode.appendChild(b);
      }

      bootApp();
      attempt();
      setTimeout(watchdog, WATCHDOG_MS);
    })();
  </script>
</body>
</html>
