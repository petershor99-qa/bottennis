name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Синтаксис страницы Mini App (v2.172.0): ошибку в app.js раньше ловило
      # только ручное превью. Node на ubuntu-latest уже есть.
      - name: Check Mini App script syntax
        run: node --check webapp/static/app.js

      # app.js собран из частей webapp/src/app (v2.176.0) — не забыли пересобрать
      - name: Mini App script is built from parts
        run: python scripts/build_app_js.py --check

      # Чистые функции страницы (склонения, имена экранов, разбор чисел) — v2.174.0
      - name: Mini App logic tests (node --test)
        run: node --test tests/js/*.test.js

  # Проход по Mini App в настоящем браузере (v2.177.0, Playwright): каждый экран
  # без ошибок JS, основные действия. Пока советующая, как mypy: в деплой не входит
  # (сначала убедиться, что в CI она стабильна). Скриншот-тесты — только локально.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Mini App in browser
        env:
          RUN_E2E: "1"
        run: pytest -q tests/e2e

  mypy:
    runs-on: ubuntu-latest
    # Советующая проверка, НЕ блокирующая (continue-on-error) — на момент
    # подключения (2026-09-16) codebase не аннотирован, прогон даёт ~850
    # ошибок в 12 файлах (в основном трение SQLAlchemy Column[X] vs обычных
    # типов + непроверенный User | None). Включать как gate имеет смысл
    # только после реальной типизации моделей/хендлеров — см. заметку в
    # CLAUDE.md "Известные ограничения". Пока просто держит отчёт видимым в
    # каждом прогоне CI, не мешая мержу.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Type check (mypy, informational only)
        continue-on-error: true
        run: mypy bot/ --ignore-missing-imports

  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # v2.186.0: процент покрытия кода бота — в журнале и в итоге прогона CI
      # (только показывается, порога нет)
      - name: Run tests
        run: pytest -v --cov=bot --cov-report=term

      - name: Coverage summary
        if: always()
        run: |
          echo "### Покрытие кода тестами" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 8 файлов с самым низким покрытием и итог
          coverage report --sort=cover | head -n 10 >> "$GITHUB_STEP_SUMMARY" || true
          coverage report | tail -n 1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    # Только при пуше в main (т.е. после мержа PR develop→main) и только если
    # lint + pytest зелёные. На develop и в PR — job пропускается.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/bottennis
            if ! git pull --ff-only; then
              echo "::error::git pull --ff-only упал — деплой остановлен, на проде осталась предыдущая версия"
              exit 1
            fi
            if ! /opt/bottennis/.venv/bin/pip install -r requirements.txt; then
              echo "::error::pip install упал — деплой остановлен, зависимости не обновлены, сервис не перезапущен"
              exit 1
            fi
            systemctl restart bottennis
            sleep 10
            if ! systemctl is-active --quiet bottennis; then
              echo "::error::bottennis.service не активен после рестарта"
              journalctl -u bottennis --no-pager -n 30
              exit 1
            fi
            echo "bottennis.service активен."
            # v2.174.0: приложение (если включено) отвечает страницей с версией скрипта —
            # ловит падение веб-части при живом боте
            if grep -qE '^WEBAPP_URL=.+' .env; then
              PORT=$(grep -E '^WEBAPP_PORT=' .env | cut -d= -f2 | tr -d '"[:space:]')
              PORT=${PORT:-8081}
              if ! curl -fsS --retry 5 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${PORT}/" | grep -q 'static/app.js?v='; then
                echo "::error::Mini App не отвечает на 127.0.0.1:${PORT} после рестарта"
                journalctl -u bottennis --no-pager -n 30
                exit 1
              fi
              echo "Mini App отвечает."
            fi
            journalctl -u bottennis --no-pager -n 30

  release:
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version and notes from RELEASE_NOTES.md
        id: extract
        run: |
          python3 - <<'EOF'
          import re, os, sys

          text = open("RELEASE_NOTES.md").read()
          m = re.search(r'^## (v[\d.]+)', text, re.MULTILINE)
          if not m:
              print("No version heading found in RELEASE_NOTES.md", file=sys.stderr)
              sys.exit(1)
          version = m.group(1)
          start = m.end()
          end = text.find('\n---', start)
          notes = text[start:end].strip() if end != -1 else text[start:].strip()

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={version}\n")
          with open('release_body.md', 'w') as f:
              f.write(notes)
          print(f"Extracted: {version}, notes length: {len(notes)}")
          EOF

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release_body.md \
              --latest
          fi
